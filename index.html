<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 12% 12%,#ede9fe 0,transparent 48%),radial-gradient(ellipse at 90% 85%,#fce7f3 0,transparent 48%),#f1f5f9;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:460px;min-width:0;text-align:center}
.card{position:relative;overflow:hidden;background:#fff;border:1px solid #e5e7eb;border-radius:28px;padding:28px 24px 26px;box-shadow:0 12px 40px rgba(108,92,231,.09)}
.card:before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#6c5ce7,#a29bfe,#fd79a8)}
.brands{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:20px}
.brand{min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo{width:64px;height:64px;border-radius:18px;display:grid;place-items:center}
.box-logo{background:#f0edff;border:1px solid #e8e3ff}
.box-logo img{width:56px;height:56px;object-fit:contain;display:block}
.rp-logo{background:linear-gradient(135deg,#ffe4e6,#f3e8ff);font-size:30px;box-shadow:0 8px 16px -4px rgba(254,205,211,.4)}
.brand-name{font-size:clamp(13px,3.7vw,17px);font-weight:800;letter-spacing:-.45px;overflow-wrap:anywhere}
.join{color:#a29bfe;font-size:22px;font-weight:400;align-self:center;margin-bottom:24px}
.status{display:inline-flex;align-items:center;gap:6px;background:#f3f0ff;color:#5947bd;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:#6c5ce7}
h1{font-size:clamp(21px,5vw,26px);letter-spacing:-.8px;margin:12px 0 6px;line-height:1.35}
p{font-size:14px;line-height:1.75;color:#475569;margin:0;word-break:keep-all;overflow-wrap:anywhere}
.schedule{margin:16px 0;background:linear-gradient(135deg,#f8f7ff,#fff7fb);border:1px solid #e9e3f5;border-radius:16px;padding:14px 10px}
.label{font-size:12px;color:#64748b;font-weight:700;margin-bottom:5px}
.date{font-size:clamp(14px,4vw,17px);font-weight:800;color:#1e293b;line-height:1.6;overflow-wrap:anywhere}
.resume{font-size:13px;color:#5947bd;font-weight:700;margin-top:7px;line-height:1.5;word-break:keep-all}
footer{margin-top:14px;font-size:12px;color:#64748b;line-height:1.6}
@media(max-width:380px){body{padding:16px} .card{padding:22px 14px 20px}.brands{gap:4px;margin-bottom:16px}.logo{width:56px;height:56px}.box-logo img{width:48px;height:48px}.rp-logo{font-size:26px}}
.en{display:block;font-size:12px;line-height:1.45;font-weight:400;color:#64748b;letter-spacing:0;margin-top:3px;overflow-wrap:anywhere;word-break:normal}.brand-name .en{font-size:11px;margin-top:2px}.status{flex-wrap:wrap;justify-content:center;gap:5px}.status .en{display:inline;margin:0;color:inherit;font-size:11px}.status .sep{opacity:.5}.label .en{display:inline;margin:0;font-size:11px}.resume .en{color:#5947bd}.date .en{font-size:12px}.brand-name{line-height:1.35}.rp-name{min-height:calc(1.35em + 18px);display:flex;align-items:center;justify-content:center}.join{margin-bottom:32px}h1 .en{font-size:15px;font-weight:600;margin-top:4px}p{line-height:1.55}@media(max-width:380px){.status{padding:5px 8px;font-size:11px}.status .en{font-size:10px}.en{font-size:11px}h1 .en{font-size:14px}}
</style>
